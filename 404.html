<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You've been invited — StoryEntry</title>
    <meta
      name="description"
      content="A private place for friends and family to swap voice and video stories through prompts."
    />
    <meta name="theme-color" content="#011530" />

    <!-- Generic social preview (this file also serves real 404s, so the copy
         stays neutral; the invite UI is rendered client-side per path). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="StoryEntry" />
    <meta property="og:title" content="StoryEntry — Telling stories with people you love" />
    <meta
      property="og:description"
      content="A private place for friends and family to swap voice and video stories through prompts."
    />
    <meta property="og:image" content="https://storyentry.app/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Pacifico&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />

    <style>
      /* Author display rules (e.g. .cta-button) override the UA [hidden] rule,
         so make the attribute reliable for our toggled elements. */
      [hidden] { display: none !important; }

      .invite-page { max-width: 560px; }
      .invite-page h1 { font-size: 32px; text-align: center; margin: 0 0 16px; }
      .invite-page .lede { text-align: center; margin-bottom: 28px; }

      .cta-button {
        display: block;
        text-align: center;
        background: var(--grad-cta);
        color: #fff;
        font-weight: 700;
        font-size: 17px;
        text-decoration: none;
        padding: 16px 24px;
        border-radius: 14px;
        box-shadow: 0 6px 20px rgba(45, 212, 191, 0.3);
        transition: transform var(--duration) var(--ease),
          box-shadow var(--duration) var(--ease);
        margin-bottom: 28px;
      }
      .cta-button:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 26px rgba(45, 212, 191, 0.4);
      }

      .invite-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 24px;
      }
      .card-label {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-faint);
        margin: 0 0 10px;
      }
      .code-box {
        background: rgba(0, 0, 0, 0.25);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 12px;
        overflow-wrap: anywhere;
        word-break: break-all;
      }
      .code-box code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
        color: var(--text-muted);
      }
      .copy-btn {
        background: transparent;
        color: var(--accent);
        border: 1px solid var(--accent);
        border-radius: 10px;
        padding: 10px 16px;
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background var(--duration) var(--ease),
          color var(--duration) var(--ease);
      }
      .copy-btn:hover { background: var(--accent); color: var(--bg); }
      .steps { margin: 20px 0 0; padding-left: 20px; color: var(--text-muted); }
      .steps li { font-size: 15px; line-height: 1.5; margin-bottom: 8px; }
      .steps strong { color: var(--text); }

      .beta-note {
        background: rgba(45, 212, 191, 0.08);
        border: 1px solid rgba(45, 212, 191, 0.25);
        border-radius: 12px;
        padding: 14px 16px;
        margin-bottom: 28px;
        font-size: 15px;
        line-height: 1.5;
        color: var(--text-muted);
        text-align: center;
      }

      .notfound { text-align: center; }
      .notfound a { color: var(--accent); text-decoration: underline; }
    </style>
  </head>
  <body>
    <main class="page invite-page">
      <div style="text-align: center">
        <a class="wordmark" href="/">StoryEntry</a>
      </div>

      <div id="invite-view" hidden>
        <h1>You've been invited to StoryEntry</h1>
        <a class="cta-button" id="install-btn" href="#" hidden>Get StoryEntry</a>
        <p class="beta-note" id="beta-note" hidden>
          StoryEntry is in a private beta right now, so it’s invite-only. If you
          already have the app, paste your invite below to connect.
        </p>
        <div class="invite-card">
          <p class="card-label">Your invite link</p>
          <div class="code-box"><code id="invite-link"></code></div>
          <button class="copy-btn" id="copy-btn" type="button">Copy link</button>
          <ol class="steps" id="steps"></ol>
        </div>
      </div>

      <div id="notfound-view" class="notfound" hidden>
        <h1>Page not found</h1>
        <p class="lede">
          That page doesn’t exist. <a href="/">Go to the homepage.</a>
        </p>
      </div>
    </main>

    <script>
      (function () {
        // Where "Get StoryEntry" points. Empty during the private (internal)
        // TestFlight beta — there's no public install path, so we hide the
        // button and show an invite-only note instead. Set this to an external
        // TestFlight or App Store link and the button + an "Install" step
        // appear automatically.
        var INSTALL_URL = '';

        var match = window.location.pathname.match(/^\/i\/([0-9a-fA-F]{64})\/?$/);
        if (match) {
          var link = 'https://storyentry.app/i/' + match[1].toLowerCase();
          document.getElementById('invite-link').textContent = link;
          document.getElementById('invite-view').hidden = false;

          var steps = document.getElementById('steps');
          if (INSTALL_URL) {
            var installBtn = document.getElementById('install-btn');
            installBtn.href = INSTALL_URL;
            installBtn.hidden = false;
            steps.innerHTML =
              '<li>Install StoryEntry and open it.</li>' +
              '<li>Sign up with your phone or Apple ID.</li>' +
              '<li>Tap <strong>&ldquo;Have an invite link?&rdquo;</strong> and paste this to connect.</li>';
          } else {
            document.getElementById('beta-note').hidden = false;
            steps.innerHTML =
              '<li>Open StoryEntry on your iPhone and sign in.</li>' +
              '<li>Tap <strong>&ldquo;Have an invite link?&rdquo;</strong> and paste this to connect.</li>';
          }

          var btn = document.getElementById('copy-btn');
          btn.addEventListener('click', function () {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(link).then(
                function () {
                  btn.textContent = 'Copied!';
                  setTimeout(function () { btn.textContent = 'Copy link'; }, 2000);
                },
                function () { btn.textContent = 'Press and hold the link to copy'; }
              );
            } else {
              btn.textContent = 'Press and hold the link to copy';
            }
          });
        } else {
          document.getElementById('notfound-view').hidden = false;
        }
      })();
    </script>
  </body>
</html>
